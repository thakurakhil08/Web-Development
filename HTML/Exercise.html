<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Video File</title>
</head>
<body>
    <h1>My Audio Files</h1>

    <h2>Audio Files 1</h2>
    <audio src="1.mp3" controls autoplay loop muted></audio>

    <h2>Audio Files 2</h2>
    <audio src="2.mp3" controls autoplay loop muted></audio>

    <h2>Audio Files 3</h2>
    <audio src="3.mp3" controls autoplay loop muted></audio>

    <h2>Audio Files 4</h2>
    <audio src="4.mp3" controls autoplay loop muted></audio>

    <h2>Audio Files 5</h2>
    <audio src="5.mp3" controls autoplay loop muted></audio>

    <h2>Audio Files 6</h2>
    <audio src="6.mp3" controls autoplay loop muted></audio>


    <h1>My Video Files</h1>

    <h2>Video Files 1</h2>
    <video src="1.mp4" controls loop muted></video>

    <h2>Video Files 2</h2>
    <video src="2.mp4" controls loop muted></video>

    <h2>Video Files 3</h2>
    <video src="3.mp4" controls loop muted></video>

    <h2>Video Files 4</h2>
    <video src="4.mp4" controls loop muted></video>

    <h2>Video Files 5</h2>
    <video src="5.mp4" controls loop muted></video>

    <h2>Video Files 6</h2>
    <video src="6.mp4" controls loop muted></video>
</body>
</html>
