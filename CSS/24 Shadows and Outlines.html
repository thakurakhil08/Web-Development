<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: solid black;
            padding: 34px;
            box-shadow: 5px 5px 15px #823838;
        }

        .text-element {
            text-shadow: 2px 2px 4px #823838;
            outline: 2px solid black;
            border: 2px solid green;
            outline-offset: 8px;
            border-radius: 19px;
        }
    </style>
</head>

<body>
    <div class="box">
        I am a box
    </div>

    <p class="text-element">
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Esse dolore excepturi cupiditate cum, est error quis
        suscipit nulla obcaecati accusamus minima consequuntur nostrum neque magnam ratione unde corrupti repudiandae
        libero culpa laudantium alias. Doloribus?
    </p>
</body>

</html>
