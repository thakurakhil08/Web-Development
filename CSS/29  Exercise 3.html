<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #f0f0f0;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card img{
            width: 100%;
            height: 700px;
            object-fit: cover;
        }

        .content{
            padding: 20px;
        }

        .content h2{
            margin-bottom: 10px;
            color: #222;
        }

        .content p{
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        button{
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="card.png" alt="Card Image">
        <div class="content">
            <h2>Beautiful Nature</h2>

            <p>
                Nature gives us peace and happiness.
                Explore the beauty of the world.
            </p>

            <button>Read More</button>
        </div>
    </div>
</body>
</html>
